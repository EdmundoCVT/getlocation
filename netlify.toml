[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Toutes les pages déclarent une URL canonique "propre" (sans .html, ex.
# https://getlocation.fr/vehicules) et sitemap.xml utilise le même format.
# Sans ce réglage, ces URL ne sont PAS automatiquement servies par Netlify
# (elles renverraient une 404) à moins que l'option "Pretty URLs" n'ait été
# activée manuellement dans le tableau de bord Netlify — un réglage
# invisible depuis ce dépôt. On le déclare donc explicitement ici pour que
# le comportement soit garanti par la configuration versionnée plutôt que
# par un réglage caché du dashboard. Les URL avec .html restent également
# accessibles (pas de redirection forcée) : aucune URL existante n'est
# cassée par ce changement.
[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Aucun domaine tiers requis pour le paiement : Mollie se fait par
    # redirection de page complète (voir netlify/functions/create-payment.js),
    # pas par un script/iframe embarqué sur nos pages — contrairement à
    # l'ancien flux Stripe Elements.
    # cdnjs.cloudflare.com : jsPDF, chargé par contrat.html pour générer le
    # PDF du contrat signé (aperçu agence + copie téléchargeable client).
    # connect-src https://shiny-caramel-1ba9fc.netlify.app : depuis la
    # bascule DNS de getlocation.fr vers Cloudflare (Phase A de la
    # migration, fonctions toujours sur Netlify), js/app.js appelle
    # create-payment/reservation-status en cross-origin explicite vers ce
    # domaine (NETLIFY_FUNCTIONS_BASE) — sans cette entrée, la CSP bloque
    # silencieusement ces appels malgré un CORS serveur correct, cassant le
    # tunnel de paiement pour tout visiteur arrivant sur getlocation.fr.
    # Ce fichier (netlify.toml) prime sur _headers pour ce header sur
    # Netlify : les deux doivent rester synchronisés tant que _headers
    # existe (voir plan de migration, risque documenté).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://shiny-caramel-1ba9fc.netlify.app; font-src 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# css/style.css et js/app.js sont chargés avec un paramètre de version
# (?v=N, incrémenté manuellement à chaque changement fonctionnel — voir
# js/app.js?v=3 et css/style.css?v=5 dans les pages HTML). Le navigateur
# met en cache chaque combinaison URL+query string séparément : un cache
# long et "immutable" est donc sûr ici, puisqu'un changement de contenu
# s'accompagne toujours d'un nouveau ?v=, qui pointe vers une URL jamais
# vue auparavant. IMPORTANT : si un changement est fait à ces fichiers
# sans incrémenter ?v=, les visiteurs déjà passés sur le site garderont
# l'ancienne version jusqu'à un an — toujours penser à bumper la version.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
