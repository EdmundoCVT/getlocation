<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>État des lieux | GET LOCATION</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{background:#f6f7fa}.inspection{max-width:760px;margin:auto;padding:16px}.inspection header,.inspection section{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.mode{color:#ff6b00;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field input,.field select,.field textarea{min-height:44px;padding:9px}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.photo{min-height:104px;border:1px dashed #bbc2cd;border-radius:12px;padding:8px;position:relative}.photo>input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:76px;object-fit:cover}.photo-record{display:grid;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid #edf0f3}.photo-record img{width:100%;height:110px;object-fit:cover;border-radius:8px}.photo-record label{display:grid;gap:4px;font-size:.82rem;font-weight:700}.photo-record input{min-height:42px;padding:7px}.photo-imported{font-size:.75rem;color:#565d68}.primary{width:100%;min-height:52px;background:#ff6b00;color:#fff;border:0;border-radius:12px;font-weight:700}.legacy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.legacy-grid div{padding:10px;background:#f6f7fa;border-radius:10px}.legacy-grid strong{display:block;font-size:.78rem;color:#565d68}.legacy-photo img,.legacy-signature img{width:100%;max-height:240px;object-fit:contain;background:#f6f7fa;border-radius:10px}.legacy-photo,.legacy-signature{margin:10px 0}.legacy-marks{padding-left:20px}.readonly-note{color:#565d68;font-size:.9rem}.legacy-sketch-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.legacy-sketch-view{display:grid;gap:5px;font-size:.8rem}.legacy-sketch-canvas{position:relative;min-height:120px;border:1px solid #dfe3e8;border-radius:10px;background:#fff}.legacy-sketch-canvas svg{width:100%;height:120px}.legacy-sketch-outline{fill:none;stroke:#737d8b;stroke-width:2}.legacy-sketch-mark{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-weight:800;color:#fff;background:#c0392b;box-shadow:0 0 0 2px #fff}.legacy-sketch-bosse,.legacy-sketch-impact{background:#ff6b00}.legacy-sketch-eclat{background:#0066ff}@media(min-width:600px){.photos{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:430px){.grid,.legacy-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="inspection">
  <header><strong>GET LOCATION</strong><h1>État des lieux</h1><div id="mode" class="mode"></div><p id="summary">Chargement…</p></header>
  <div id="legacyContent" hidden></div>
  <form id="form">
    <section><h2>Véhicule</h2><div class="grid"><label class="field">Kilométrage<input required id="km" type="number" min="0"></label><label class="field">Carburant<select id="carburant"></select></label><label class="field">Propreté<input id="proprete" placeholder="État de propreté"></label><label class="field">Clés et accessoires<input id="clesAccessoires"></label></div><label class="field">Dommages / remarques<textarea id="dommages" rows="4"></textarea></label></section>
    <section id="departCompare" hidden><h2>Dommages déjà présents au départ</h2><p id="departDamage"></p></section>
    <section><h2>Photos du véhicule</h2><div id="photos" class="photos"></div></section>
    <section><button class="primary" id="save" type="submit"></button><p id="message" role="status"></p></section>
  </form>
</main>
<script src="js/inspection-v2.js?v=1"></script>
<script src="js/legacy-inspection-sketch.js?v=1"></script>
<script>
(function(){
  const params=new URLSearchParams(location.search),legacy=params.get('source')==='legacy',legacyId=params.get('legacyId')||'',token=new URLSearchParams(location.hash.slice(1)).get('agencyToken'),mode=params.get('mode')==='retour'?'retour':'depart',slots=['avant','arriere','gauche','droite','avant-gauche','avant-droit','arriere-gauche','arriere-droit','interieur','jante','dommage','autre'];
  const $=id=>document.getElementById(id),escape=value=>String(value==null?'—':value),A={Authorization:'Bearer '+token};
  $('mode').textContent=mode.toUpperCase();

  function legacyField(label,value){const d=document.createElement('div'),s=document.createElement('strong');s.textContent=label;d.append(s,document.createTextNode(escape(value)));return d}
  function renderLegacy(view){
    const stage=view[mode]||{},box=$('legacyContent');$('form').hidden=true;box.hidden=false;
    $('summary').textContent=[view.vehicule,view.immatriculation,view.contractNumero||view.id,view.client&&(view.client.prenom+' '+view.client.nom),view.dateDebut+' '+view.heureDebut+' → '+view.dateFin+' '+view.heureFin].filter(Boolean).join(' · ');
    const section=document.createElement('section'),title=document.createElement('h2');title.textContent='État des lieux '+mode;section.append(title);
    const note=document.createElement('p');note.className='readonly-note';note.textContent='Historique en consultation seule — les données existantes ne sont pas modifiées.';section.append(note);
    if(legacyId==='res_f0e1a8457204d89acdc4542491ffcb53'&&mode==='retour'){const recovery=document.createElement('a');recovery.className='primary';recovery.style.display='grid';recovery.style.placeItems='center';recovery.style.textDecoration='none';recovery.href='/recuperation-zvezdan.html';recovery.textContent='Consulter les photos originales du retour';section.append(recovery)}
    const grid=document.createElement('div');grid.className='legacy-grid';[['Date et heure',stage.dateHeure],['Kilométrage',stage.km],['Carburant',stage.carburant],['Propreté',stage.proprete],['Nombre de clés',stage.cles],['Accessoires',stage.accessoires],['Agent',stage.agent],['Signature client EDL',stage.clientSigne],['Signature agence EDL',stage.agenceSigne],['Référence photos',stage.photosRef],['Remarques',stage.remarques]].forEach(x=>grid.append(legacyField(x[0],x[1])));section.append(grid);
    const marks=Array.isArray(stage.marques)?stage.marques:[];if(marks.length){const h=document.createElement('h3');h.textContent='Croquis et dommages';section.append(h);const sketch=document.createElement('div');window.renderLegacyInspectionSketch(sketch,marks);section.append(sketch)}
    const photos=Array.isArray(stage.photos)?stage.photos:[];if(photos.length){const h=document.createElement('h3');h.textContent='Photos historiques';section.append(h);photos.forEach(photo=>{const wrap=document.createElement('div');wrap.className='legacy-photo';const meta=document.createElement('p');meta.textContent=[photo.label||photo.slot||'Photo',photo.capturedAt||photo.dateHeure||'',photo.createdAt?'Importée le : '+photo.createdAt:''].filter(Boolean).join(' — ');wrap.append(meta);const img=new Image();img.alt=photo.label||photo.slot||'Photo historique de l’état des lieux';if(typeof photo.dataUrl==='string'&&photo.dataUrl.startsWith('data:image/'))img.src=photo.dataUrl;else if(photo.key)img.src='/api/legacy-inspection-media?id='+encodeURIComponent(legacyId)+'&key='+encodeURIComponent(photo.key);else{const missing=document.createElement('p');missing.className='readonly-note';missing.textContent='Référence photo historique conservée.';wrap.append(missing);section.append(wrap);return}wrap.append(img);section.append(wrap)})}
    const signature=view.contractSignature;if(signature&&(signature.imageDataUrl||signature.signedAt||signature.signatureId)){const sig=document.createElement('div');sig.className='legacy-signature';const h=document.createElement('h3');h.textContent='Signature du contrat';sig.append(h);const meta=document.createElement('p');meta.textContent=[signature.signedAt,signature.signatureId].filter(Boolean).join(' — ')||'Signature enregistrée';sig.append(meta);if(typeof signature.imageDataUrl==='string'&&signature.imageDataUrl.startsWith('data:image/')){const img=new Image();img.alt='Signature du contrat';img.src=signature.imageDataUrl;sig.append(img)}section.append(sig)}
    box.append(section);
  }

  if(legacy){
    if(!legacyId){document.body.innerHTML='<p>État des lieux historique introuvable.</p>';return}
    fetch('/api/legacy-inspection-agency?id='+encodeURIComponent(legacyId),{credentials:'same-origin'}).then(async r=>{const body=await r.json();if(!r.ok)throw new Error(body.error||'Accès agence requis');return body.inspection}).then(renderLegacy).catch(err=>{$('summary').textContent=err.message||'Accès agence requis.'});
    return;
  }

  if(!token){document.body.innerHTML='<p>Accès agence requis.</p>';return}
  const api=(u,o={})=>fetch(u,{...o,headers:{...A,...o.headers}});$('save').textContent='Valider l’état des lieux de '+mode;for(let i=0;i<=100;i+=10)$('carburant').add(new Option(i+' %',i));let dossier,media;
  function localDateTime(value){if(!value)return '';let d=new Date(value);return Number.isNaN(d.getTime())?'':String(d.getFullYear()).padStart(4,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
  function formatImportDate(value){let d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleString('fr-FR')}
  function replaceMediaItem(stage,item){media[stage]=(media[stage]||[]).map(x=>x&&x.key===item.key?item:x)}
  function photoRecord(stage,item){let record=document.createElement('div');record.className='photo-record';api('/api/inspection-media?key='+encodeURIComponent(item.key)).then(r=>r.ok?r.blob():null).then(b=>{if(!b)return;let im=new Image();im.alt='Photo '+(item.slot||'véhicule');im.src=URL.createObjectURL(b);record.prepend(im)});let label=document.createElement('label');label.textContent='Date/heure de la photo :';let input=document.createElement('input');input.type='datetime-local';input.value=localDateTime(item.capturedAt);input.addEventListener('change',async()=>{if(!input.value)return $('message').textContent='Saisissez la date/heure de la photo.';let r=await api('/api/inspection-media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:item.key,capturedAt:input.value})}),j=await r.json();if(!r.ok){$('message').textContent=j.error||'Mise à jour de la date impossible';input.value=localDateTime(item.capturedAt);return}replaceMediaItem(stage,j.item);item=j.item;$('message').textContent='Date/heure de la photo enregistrée.'});label.append(input);record.append(label);if(item.createdAt){let imported=document.createElement('small');imported.className='photo-imported';imported.textContent='Importée le : '+formatImportDate(item.createdAt);record.append(imported)}return record}
  function photo(stage,slot){let d=document.createElement('label');d.className='photo';d.append(document.createTextNode(slot.replaceAll('-',' ')));let input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='environment';input.onchange=async()=>{let f=input.files[0];if(!f)return;let fd=new FormData();fd.append('stage',stage);fd.append('slot',slot);fd.append('capturedAt',localDateTime(new Date()));fd.append('file',f);let r=await api('/api/inspection-media',{method:'POST',body:fd});if(!r.ok)return $('message').textContent='Envoi photo impossible';let j=await r.json();media[stage].push(j.item);renderPhotos()};d.append(input);(media[stage]||[]).filter(x=>x.slot===slot).forEach(item=>d.append(photoRecord(stage,item)));return d}
  function renderPhotos(){let p=$('photos');p.textContent='';slots.forEach(s=>p.append(photo(mode,s)))}
  function fill(){let x=dossier[mode]||{};$('km').value=x.km??'';$('carburant').value=x.carburant??100;$('proprete').value=x.proprete||'';$('clesAccessoires').value=x.clesAccessoires||'';$('dommages').value=x.dommages||'';if(mode==='retour'&&dossier.depart){$('departCompare').hidden=false;$('departDamage').textContent=dossier.depart.dommages||'Aucun dommage renseigné.'}renderPhotos()}
  api('/api/contract-dossier-agency').then(async r=>{if(!r.ok)throw 0;let j=await r.json();dossier=j.dossier;media=dossier.media||{depart:[],retour:[]};$('summary').textContent=[j.reservation.vehicule?.nom,j.reservation.vehicule?.immatriculation,j.reservation.id,j.reservation.conducteur?.prenom+' '+j.reservation.conducteur?.nom,j.reservation.dateDebut+' '+j.reservation.heureDebut].filter(Boolean).join(' · ');fill()}).catch(()=>{$('summary').textContent='Accès invalide ou expiré.'});
  $('form').onsubmit=async e=>{e.preventDefault();let b={action:'update-'+mode,dateHeure:new Date().toISOString(),km:Number($('km').value),carburant:Number($('carburant').value),proprete:$('proprete').value,clesAccessoires:$('clesAccessoires').value,dommages:$('dommages').value,agent:'',clientSigne:'',agenceSigne:''};let r=await api('/api/contract-dossier-agency',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();$('message').textContent=r.ok?'État des lieux enregistré.':j.error||'Erreur';if(r.ok){dossier=j.dossier;media=dossier.media||media;fill()}};
})();
</script>
</body>
</html>
