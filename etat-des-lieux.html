<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>État des lieux | GET LOCATION</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f6f7fa}.inspection{max-width:760px;margin:auto;padding:16px}.inspection header,.inspection section{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}.mode{color:#ff6b00;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field input,.field select,.field textarea{min-height:44px;padding:9px}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.photo{min-height:104px;border:1px dashed #bbc2cd;border-radius:12px;padding:8px;position:relative}.photo input{position:absolute;inset:0;opacity:0}.photo img{width:100%;height:76px;object-fit:cover}.primary{width:100%;min-height:52px;background:#ff6b00;color:#fff;border:0;border-radius:12px;font-weight:700}@media(min-width:600px){.photos{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="inspection"><header><strong>GET LOCATION</strong><h1>État des lieux</h1><div id="mode" class="mode"></div><p id="summary">Chargement…</p></header><form id="form"><section><h2>Véhicule</h2><div class="grid"><label class="field">Kilométrage<input required id="km" type="number" min="0"></label><label class="field">Carburant<select id="carburant"></select></label><label class="field">Propreté<input id="proprete" placeholder="État de propreté"></label><label class="field">Clés et accessoires<input id="clesAccessoires"></label></div><label class="field">Dommages / remarques<textarea id="dommages" rows="4"></textarea></label></section><section id="departCompare" hidden><h2>Dommages déjà présents au départ</h2><p id="departDamage"></p></section><section><h2>Photos du véhicule</h2><div id="photos" class="photos"></div></section><section><button class="primary" id="save" type="submit"></button><p id="message" role="status"></p></section></form></main><script src="js/inspection-v2.js?v=1"></script><script>(function(){const token=new URLSearchParams(location.hash.slice(1)).get('agencyToken'),mode=new URLSearchParams(location.search).get('mode')==='retour'?'retour':'depart',A={Authorization:'Bearer '+token},slots=['avant','arriere','gauche','droite','avant-gauche','avant-droit','arriere-gauche','arriere-droit','interieur','jante','dommage','autre'];if(!token){document.body.innerHTML='<p>Accès agence requis.</p>';return}const $=id=>document.getElementById(id),api=(u,o={})=>fetch(u,{...o,headers:{...A,...o.headers}});$('mode').textContent=mode.toUpperCase();$('save').textContent='Valider l’état des lieux de '+mode;for(let i=0;i<=100;i+=10)$('carburant').add(new Option(i+' %',i));let dossier,media;function photo(stage,slot){let d=document.createElement('label');d.className='photo';d.textContent=slot.replaceAll('-',' ');let input=document.createElement('input');input.type='file';input.accept='image/*';input.capture='environment';input.onchange=async()=>{let f=input.files[0];if(!f)return;let fd=new FormData();fd.append('stage',stage);fd.append('slot',slot);fd.append('file',f);let r=await api('/api/inspection-media',{method:'POST',body:fd});if(!r.ok)return $('message').textContent='Envoi photo impossible';let j=await r.json();media[stage].push(j.item);renderPhotos()};d.append(input);let m=(media[stage]||[]).filter(x=>x.slot===slot).pop();if(m){api('/api/inspection-media?key='+encodeURIComponent(m.key)).then(r=>r.blob()).then(b=>{let im=new Image();im.src=URL.createObjectURL(b);d.prepend(im)})}return d}function renderPhotos(){let p=$('photos');p.textContent='';slots.forEach(s=>p.append(photo(mode,s)))}function fill(){let x=dossier[mode]||{};$('km').value=x.km??'';$('carburant').value=x.carburant??100;$('proprete').value=x.proprete||'';$('clesAccessoires').value=x.clesAccessoires||'';$('dommages').value=x.dommages||'';if(mode==='retour'&&dossier.depart){$('departCompare').hidden=false;$('departDamage').textContent=dossier.depart.dommages||'Aucun dommage renseigné.'}renderPhotos()}api('/api/contract-dossier-agency').then(async r=>{if(!r.ok)throw 0;let j=await r.json();dossier=j.dossier;media=dossier.media||{depart:[],retour:[]};$('summary').textContent=[j.reservation.vehicule?.nom,j.reservation.vehicule?.immatriculation,j.reservation.id,j.reservation.conducteur?.prenom+' '+j.reservation.conducteur?.nom,j.reservation.dateDebut+' '+j.reservation.heureDebut].filter(Boolean).join(' · ');fill()}).catch(()=>{$('summary').textContent='Accès invalide ou expiré.'});$('form').onsubmit=async e=>{e.preventDefault();let b={action:'update-'+mode,dateHeure:new Date().toISOString(),km:Number($('km').value),carburant:Number($('carburant').value),proprete:$('proprete').value,clesAccessoires:$('clesAccessoires').value,dommages:$('dommages').value,agent:'',clientSigne:'',agenceSigne:''};let r=await api('/api/contract-dossier-agency',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();$('message').textContent=r.ok?'État des lieux enregistré.':j.error||'Erreur';if(r.ok){dossier=j.dossier;media=dossier.media||media;fill()}}})();</script></body></html>
